apiVersion: apps/v1
kind: Deployment
metadata: { name: brain-lab, labels: { app: brain-lab } }
spec:
  replicas: 2
  selector: { matchLabels: { app: brain-lab } }
  template:
    metadata: { labels: { app: brain-lab } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: app
          image: ghcr.io/witternif2003-beep/brain-lab:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://otel-collector:4318' }
            - { name: OTEL_SERVICE_NAME, value: brain-lab }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 30, failureThreshold: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: brain-lab, labels: { app: brain-lab } }
spec:
  selector: { app: brain-lab }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: brain-lab }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: brain-lab }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
      memory_limiter: { check_interval: 5s, limit_mib: 256 }
    exporters:
      debug: { verbosity: basic }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ['--config=/etc/otel/config.yaml']
          ports: [{ containerPort: 4317 }, { containerPort: 4318 }]
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
          resources: { limits: { memory: 384Mi } }
      volumes: [{ name: config, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  selector: { app: otel-collector }
  ports: [{ name: grpc, port: 4317 }, { name: http, port: 4318 }]
