{{- if .Values.collector.enabled }}
{{- $exporters := merge (dict "debug" (dict "verbosity" "basic") "prometheus" (dict "endpoint" "0.0.0.0:8889")) .Values.collector.exporters }}
{{- $traceExporters := without (keys $exporters | sortAlpha) "prometheus" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "brain-lab.collector" . }}
  labels: {{- include "brain-lab.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 5s, limit_mib: 256 }
      batch: {}
    exporters:
      {{- toYaml $exporters | nindent 6 }}
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [{{ join ", " $traceExporters }}] }
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brain-lab.collector" . }}
  labels: {{- include "brain-lab.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: otel-collector }
  template:
    metadata:
      labels:
        {{- include "brain-lab.labels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
      annotations:
        checksum/config: {{ toYaml $exporters | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{ name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }, { name: prom, containerPort: 8889 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
          resources: {{- toYaml .Values.collector.resources | nindent 12 }}
      volumes: [{ name: config, configMap: { name: {{ include "brain-lab.collector" . }} } }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brain-lab.collector" . }}
  labels: {{- include "brain-lab.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: otel-collector }
  ports: [{ name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }, { name: prom, port: 8889 }]
{{- end }}
