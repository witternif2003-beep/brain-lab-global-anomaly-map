global:
  scrape_interval: 60s
  scrape_timeout: 55s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: brain-lab
    metrics_path: /api/metrics
    static_configs: [{ targets: ['app:3000'] }]
  - job_name: otel-collector
    static_configs: [{ targets: ['otel-collector:8889'] }]
